name: Build Android APK (For Mid-term)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Toolchains
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ✅ 关键：确保 GitHub Runner 上的 Android SDK/cmdline-tools 可用
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ 关键：安装 emulator（否则 ns platform add 可能 exit 127）
      - name: Install Android SDK Packages (API 34 + emulator)
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          # 确保 PATH 有 emulator / platform-tools / cmdline-tools
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

          # 接受 licenses
          yes | sdkmanager --licenses

          # 安装必须组件（emulator 是关键）
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # 验证 emulator 是否可执行（避免再次 127）
          emulator -version || true
          adb version || true

      - name: Install NativeScript
        run: npm install -g nativescript@8.6.0 --ignore-scripts

      # ------------------------------------------------------------
      # JS dependencies
      # ------------------------------------------------------------
      - name: Install Dependencies
        run: |
          set -eux
          npm install --legacy-peer-deps
          npx ts-patch install -s

      # ------------------------------------------------------------
      # Native deps: OpenCV
      # ------------------------------------------------------------
      - name: Download OpenCV
        run: |
          set -eux
          wget -q https://github.com/opencv/opencv/releases/download/4.5.5/opencv-4.5.5-android-sdk.zip
          unzip -q opencv-4.5.5-android-sdk.zip
          rm -rf plugin-nativeprocessor/platforms/android/cpp/opencv
          mkdir -p plugin-nativeprocessor/platforms/android/cpp/opencv
          cp -r OpenCV-android-sdk/sdk/native/* plugin-nativeprocessor/platforms/android/cpp/opencv/

      # ------------------------------------------------------------
      # Native deps: Tesseract
      # ------------------------------------------------------------
      - name: Download Tesseract
        run: |
          set -eux
          wget -q https://github.com/tesseract-ocr/tesseract/archive/refs/tags/4.1.3.zip -O tesseract.zip
          unzip -q tesseract.zip
          rm -rf plugin-nativeprocessor/platforms/android/cpp/tesseract
          mkdir -p plugin-nativeprocessor/platforms/android/cpp/tesseract
          cp -r tesseract-4.1.3/* plugin-nativeprocessor/platforms/android/cpp/tesseract/

      # ------------------------------------------------------------
      # 🔥 修复：AGP + compileSdk 34 + app namespace
      # ------------------------------------------------------------
      - name: Patch AGP + compileSdk 34 + App Namespace for CI
        run: |
          set -euxo pipefail

          BUILD_SCRIPT="App_Resources/documentscanner/Android/buildscript.gradle"
          BEFORE_PLUGINS="App_Resources/documentscanner/Android/before-plugins.gradle"
          APP_GRADLE="App_Resources/documentscanner/Android/app.gradle"
          DEFAULT_NS="com.akylas.documentscanner"
          COMPILE_SDK="34"

          # AGP 升级（baseline profile 插件要求 >= 8.0）
          if [ -f "$BUILD_SCRIPT" ]; then
            sed -i 's/com.android.tools.build:gradle:7.4.2/com.android.tools.build:gradle:8.1.4/g' "$BUILD_SCRIPT" || true
          fi
          if [ -f "$BEFORE_PLUGINS" ]; then
            sed -i 's/androidBuildToolsVersion = "7.4.2"/androidBuildToolsVersion = "8.1.4"/g' "$BEFORE_PLUGINS" || true
          fi

          # compileSdk -> 34（修复 cameraX 1.3.4 要求）
          for f in "$APP_GRADLE" "$BEFORE_PLUGINS"; do
            if [ -f "$f" ]; then
              sed -i -E "s/(compileSdkVersion[[:space:]]*=?[[:space:]]*)33/\\1${COMPILE_SDK}/g" "$f" || true
              sed -i -E "s/(compileSdk[[:space:]]*=?[[:space:]]*)33/\\1${COMPILE_SDK}/g" "$f" || true
              sed -i -E "s/(androidCompileSdkVersion[[:space:]]*=?[[:space:]]*)33/\\1${COMPILE_SDK}/g" "$f" || true
            fi
          done

          # app namespace（如果没有）
          NS_PKG=""
          if [ -f "$APP_GRADLE" ]; then
            NS_PKG=$(grep -Eo "applicationId[[:space:]]+['\"][^'\"]+['\"]" "$APP_GRADLE" \
              | head -1 \
              | sed -E "s/applicationId[[:space:]]+['\"]([^'\"]+)['\"]/\\1/" \
              || true)
          fi
          if [ -z "$NS_PKG" ]; then
            NS_PKG="$DEFAULT_NS"
          fi
          echo "App namespace: $NS_PKG"

          if [ -f "$APP_GRADLE" ] && ! grep -qE '^[[:space:]]*namespace[[:space:]]+' "$APP_GRADLE"; then
            sed -i "0,/android[[:space:]]*{/s|android[[:space:]]*{|android {\n    namespace \"$NS_PKG\"|" "$APP_GRADLE"
          fi

      # ------------------------------------------------------------
      # ✅ Gradle init：namespace + legacy props + JVM 17（避免 Kotlin/Java 目标不一致）
      # ------------------------------------------------------------
      - name: Install Gradle init script (AGP8 namespace + legacy props + JVM 17)
        run: |
          set -euxo pipefail
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/ci-agp8-fixes.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          def readManifestPackage(Project p) {
              def candidates = [
                  new File(p.projectDir, "src/main/AndroidManifest.xml"),
                  new File(p.projectDir, "AndroidManifest.xml"),
                  new File(p.projectDir, "src/AndroidManifest.xml")
              ]
              for (f in candidates) {
                  if (f.exists()) {
                      def txt = f.getText("UTF-8")
                      def m = (txt =~ /package="([^"]+)"/)
                      if (m.find()) return m.group(1)
                  }
              }
              return null
          }

          gradle.beforeProject { Project p ->
              if (!p.extensions.extraProperties.has("generateReleaseBuildConfig")) {
                  p.ext.generateReleaseBuildConfig = [enabled: true]
              }
              if (!p.extensions.extraProperties.has("generateLocaleConfig")) {
                  p.ext.generateLocaleConfig = [enabled: true]
              }
          }

          allprojects { Project p ->
              p.afterEvaluate {
                  // JavaCompile -> 17
                  try {
                      p.tasks.withType(JavaCompile).configureEach { t ->
                          t.sourceCompatibility = "17"
                          t.targetCompatibility = "17"
                      }
                  } catch (Throwable ignored) {}

                  // KotlinCompile -> jvmTarget 17
                  try {
                      def kc = Class.forName("org.jetbrains.kotlin.gradle.tasks.KotlinCompile")
                      p.tasks.withType(kc).configureEach { t ->
                          try { t.kotlinOptions.jvmTarget = "17" } catch(Throwable ignored) {}
                      }
                  } catch (Throwable ignored) {}

                  // Android：namespace 自动补齐 + compileOptions 17 + buildConfig
                  try {
                      def androidExt = p.extensions.findByName("android")
                      if (androidExt != null) {
                          try {
                              def cur = (androidExt.hasProperty("namespace") ? androidExt.namespace : null)
                              if (cur == null || cur.toString().trim().isEmpty()) {
                                  def pkg = readManifestPackage(p)
                                  if (pkg == null || pkg.trim().isEmpty()) {
                                      pkg = "com.temp." + p.name.replaceAll("[^A-Za-z0-9_]", "_")
                                  }
                                  androidExt.namespace = pkg
                              }
                          } catch (Throwable ignored) {}

                          try {
                              if (androidExt.hasProperty("compileOptions") && androidExt.compileOptions != null) {
                                  androidExt.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                                  androidExt.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                              }
                          } catch (Throwable ignored) {}

                          try {
                              if (androidExt.hasProperty("buildFeatures") && androidExt.buildFeatures != null) {
                                  androidExt.buildFeatures.buildConfig = true
                              }
                          } catch (Throwable ignored) {}
                      }
                  } catch (Throwable ignored) {}
              }
          }
          EOF

      # ------------------------------------------------------------
      # ✅ 强制 Gradle Wrapper 8.5（node_modules / global）
      # ------------------------------------------------------------
      - name: Force Gradle Wrapper 8.5 everywhere (node_modules + global)
        run: |
          set -euxo pipefail
          URL="https\\://services.gradle.org/distributions/gradle-8.5-bin.zip"

          if [ -d "node_modules" ]; then
            find node_modules -name "gradle-wrapper.properties" -type f -print -exec \
              sed -i "s|distributionUrl=.*|distributionUrl=$URL|g" {} \;
          fi

          NPM_ROOT=$(npm root -g)
          if [ -d "$NPM_ROOT" ]; then
            find "$NPM_ROOT" -name "gradle-wrapper.properties" -type f -print -exec \
              sed -i "s|distributionUrl=.*|distributionUrl=$URL|g" {} \; || true
          fi

      # ------------------------------------------------------------
      # Kotlin 源码修复（你原来的）
      # ------------------------------------------------------------
      - name: Perfect Kotlin Fix
        run: |
          set -eux
          FILE=$(find plugin-nativeprocessor -name "PDFUtils.kt" | head -1)
          sed -i '1i @file:OptIn(kotlin.ExperimentalStdlibApi::class, kotlin.contracts.ExperimentalContracts::class)' "$FILE"
          sed -i 's/val document/val document_PROTECTED/g' "$FILE"
          sed -i 's/var document/var document_PROTECTED/g' "$FILE"
          sed -i 's/document *=/document_PROTECTED =/g' "$FILE"
          sed -i 's/\bdocument\b/document!!/g' "$FILE"
          sed -i 's/document_PROTECTED/document/g' "$FILE"

          mkdir -p plugin-nativeprocessor/platforms/android
          echo 'android { kotlinOptions { freeCompilerArgs += ["-Xopt-in=kotlin.ExperimentalStdlibApi", "-Xopt-in=kotlin.contracts.ExperimentalContracts"] } }' \
            >> plugin-nativeprocessor/platforms/android/include.gradle

      # ------------------------------------------------------------
      # 禁用 license hook
      # ------------------------------------------------------------
      - name: Disable License Report Hook
        run: |
          set -eux
          echo "module.exports = function() { console.log('License report skipped in CI'); };" \
            > node_modules/@nativescript-community/licenses/scripts/after-prepareNativeApp.js

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Android APK
        run: |
          set -euxo pipefail

          rm -rf platforms
          ns platform add android

          # platforms wrapper = 8.5
          URL="https\\://services.gradle.org/distributions/gradle-8.5-bin.zip"
          find platforms -name "gradle-wrapper.properties" -type f -print -exec \
            sed -i "s|distributionUrl=.*|distributionUrl=$URL|g" {} \;

          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          ns build android --release \
            --no-hmr \
            --env.abiFilters=arm64-v8a \
            --force \
            --key-store-path debug.keystore \
            --key-store-password android \
            --key-store-alias androiddebugkey \
            --key-store-alias-password android

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: platforms/android/app/build/outputs/apk/release/*.apk
